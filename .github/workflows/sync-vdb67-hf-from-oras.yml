name: Sync vdb 6.7.x Hugging Face from ORAS
"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
env:
  HF_XET_HIGH_PERFORMANCE: 1
  HF_REPO: AppThreat/vdb
  VDB_VERSION_TAG: v6.7.x
  MAX_VDB_LAYER_GB: "15"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_xz_repo: appthreat/vdbxz-app-2y
            image_zst_repo: appthreat/vdbzst-app-2y
            hf_path_prefix: app-2y
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-app-2y-extended
            image_zst_repo: appthreat/vdbzst-app-2y-extended
            hf_path_prefix: app-2y-extended
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-app
            image_zst_repo: appthreat/vdbzst-app
            hf_path_prefix: app
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-app-extended
            image_zst_repo: appthreat/vdbzst-app-extended
            hf_path_prefix: app-extended
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-app-10y
            image_zst_repo: appthreat/vdbzst-app-10y
            hf_path_prefix: app-10y
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-app-10y-extended
            image_zst_repo: appthreat/vdbzst-app-10y-extended
            hf_path_prefix: app-10y-extended
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz
            image_zst_repo: appthreat/vdbzst
            hf_path_prefix: app-os
            upload_raw_vdb6: false
          - image_xz_repo: appthreat/vdbxz-extended
            image_zst_repo: appthreat/vdbzst-extended
            hf_path_prefix: app-os-extended
            upload_raw_vdb6: false
          - image_xz_repo: appthreat/vdbxz-10y
            image_zst_repo: appthreat/vdbzst-10y
            hf_path_prefix: app-os-10y
            upload_raw_vdb6: false
          - image_xz_repo: appthreat/vdbxz-10y-extended
            image_zst_repo: appthreat/vdbzst-10y-extended
            hf_path_prefix: app-os-10y-extended
            upload_raw_vdb6: false
          - image_xz_repo: appthreat/vdbxz-alpine
            image_zst_repo: appthreat/vdbzst-alpine
            hf_path_prefix: alpine
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-ubuntu
            image_zst_repo: appthreat/vdbzst-ubuntu
            hf_path_prefix: ubuntu
            upload_raw_vdb6: false
          - image_xz_repo: appthreat/vdbxz-debian
            image_zst_repo: appthreat/vdbzst-debian
            hf_path_prefix: debian
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-redhat
            image_zst_repo: appthreat/vdbzst-redhat
            hf_path_prefix: redhat
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-alma
            image_zst_repo: appthreat/vdbzst-alma
            hf_path_prefix: alma
            upload_raw_vdb6: true
          - image_xz_repo: appthreat/vdbxz-rocky
            image_zst_repo: appthreat/vdbzst-rocky
            hf_path_prefix: rocky
            upload_raw_vdb6: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            contrib
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1
      - name: Trim CI agent
        shell: bash
        run: |
          chmod +x contrib/free_disk_space.sh
          ./contrib/free_disk_space.sh
      - name: Install Hugging Face CLI and zstd
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          hf_cli_bin_dir="${HF_CLI_BIN_DIR:-$HOME/.local/bin}"
          curl -LsSf https://hf.co/cli/install.sh | HF_CLI_BIN_DIR="$hf_cli_bin_dir" bash
          printf '%s\n' "$hf_cli_bin_dir" >> "$GITHUB_PATH"
      - name: Pull ORAS artifacts and upload to Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
          IMAGE_XZ_REPO: ${{ matrix.image_xz_repo }}
          IMAGE_ZST_REPO: ${{ matrix.image_zst_repo }}
          HF_PATH_PREFIX: ${{ matrix.hf_path_prefix }}
          UPLOAD_RAW_VDB6: ${{ matrix.upload_raw_vdb6 }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_USERNAME" --password-stdin
          max_layer_bytes=$(( MAX_VDB_LAYER_GB * 1024 * 1024 * 1024 ))
          for repo in "$IMAGE_XZ_REPO" "$IMAGE_ZST_REPO"; do
            ref="ghcr.io/$repo:$VDB_VERSION_TAG"
            biggest_layer="$(oras manifest fetch --pretty "$ref" | jq -r '[.layers[].size] | max')"
            echo "Largest layer in $ref: ${biggest_layer:-unknown} bytes"
            if [[ ! "$biggest_layer" =~ ^[0-9]+$ ]] || (( biggest_layer > max_layer_bytes )); then
              echo "::error::$ref has a ${biggest_layer:-unknown}-byte layer exceeding the ${MAX_VDB_LAYER_GB}GB guard. The published artifact looks corrupt; refusing to sync."
              exit 1
            fi
          done
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          xz_dir="$work_dir/xz"
          zst_dir="$work_dir/zst"
          mkdir -p "$xz_dir" "$zst_dir"

          echo "=== Syncing $HF_PATH_PREFIX tar.xz artifacts ==="
          oras pull "ghcr.io/$IMAGE_XZ_REPO:$VDB_VERSION_TAG" -o "$xz_dir"
          for file in vdb.meta data.vdb6.tar.xz data.index.vdb6.tar.xz; do
            if [[ ! -f "$xz_dir/$file" ]]; then
              echo "Missing expected ORAS artifact: $xz_dir/$file" >&2
              exit 1
            fi
          done
          hf upload --quiet --repo-type dataset --delete "$HF_PATH_PREFIX/*.tar.xz" "$HF_REPO" "$xz_dir/data.vdb6.tar.xz" "$HF_PATH_PREFIX/data.vdb6.tar.xz"
          hf upload --quiet --repo-type dataset "$HF_REPO" "$xz_dir/data.index.vdb6.tar.xz" "$HF_PATH_PREFIX/data.index.vdb6.tar.xz"
          hf upload --quiet --repo-type dataset "$HF_REPO" "$xz_dir/vdb.meta" "$HF_PATH_PREFIX/vdb.meta"
          rm -rf "$xz_dir"
          df -h /tmp

          echo "=== Syncing $HF_PATH_PREFIX zst artifacts ==="
          oras pull "ghcr.io/$IMAGE_ZST_REPO:$VDB_VERSION_TAG" -o "$zst_dir"
          for file in data.vdb6.zst data.index.vdb6.zst; do
            if [[ ! -f "$zst_dir/$file" ]]; then
              echo "Missing expected ORAS artifact: $zst_dir/$file" >&2
              exit 1
            fi
          done
          hf upload --quiet --repo-type dataset --delete "$HF_PATH_PREFIX/*.zst" "$HF_REPO" "$zst_dir/data.vdb6.zst" "$HF_PATH_PREFIX/data.vdb6.zst"
          hf upload --quiet --repo-type dataset "$HF_REPO" "$zst_dir/data.index.vdb6.zst" "$HF_PATH_PREFIX/data.index.vdb6.zst"

          if [[ "$UPLOAD_RAW_VDB6" == "true" ]]; then
            echo "=== Decompressing and syncing $HF_PATH_PREFIX raw vdb6 artifacts ==="
            zstd -f -d "$zst_dir/data.vdb6.zst" -o "$zst_dir/data.vdb6"
            hf upload --quiet --repo-type dataset --delete "$HF_PATH_PREFIX/*.vdb6" "$HF_REPO" "$zst_dir/data.vdb6" "$HF_PATH_PREFIX/data.vdb6"
            rm -f "$zst_dir/data.vdb6" "$zst_dir/data.vdb6.zst"
            zstd -f -d "$zst_dir/data.index.vdb6.zst" -o "$zst_dir/data.index.vdb6"
            hf upload --quiet --repo-type dataset "$HF_REPO" "$zst_dir/data.index.vdb6" "$HF_PATH_PREFIX/data.index.vdb6"
            rm -f "$zst_dir/data.index.vdb6" "$zst_dir/data.index.vdb6.zst"
          else
            echo "=== Skipping raw vdb6 upload for $HF_PATH_PREFIX; removing stale raw files ==="
            hf delete --repo-type dataset "$HF_REPO" "$HF_PATH_PREFIX/data.vdb6" || echo "No stale $HF_PATH_PREFIX/data.vdb6 on HF"
            hf delete --repo-type dataset "$HF_REPO" "$HF_PATH_PREFIX/data.index.vdb6" || echo "No stale $HF_PATH_PREFIX/data.index.vdb6 on HF"
            rm -rf "$zst_dir"
          fi
          df -h /tmp
