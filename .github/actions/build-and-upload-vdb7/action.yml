name: Build and upload VDB v7
description: Build VDB v7 artifacts and publish to GHCR with manifest v2
inputs:
  vuln-list-path:
    description: Path of the checked out vuln-list repository
    required: false
    default: vuln-list
  shard-name:
    description: Shard name used in the GHCR repo suffix and manifest artifact.name (e.g. full, app, pypi)
    required: false
    default: full
  artifact-kind:
    description: >-
      How vdb.meta marks the artifact. "full" publishes completeness=full,
      installable as the main DB via 'vdb db refresh full --image'; "shard"
      publishes completeness=partial for the shard store; "auto" (default)
      picks full only when shard-name is "full". Standalone scope variants
      (app-only, app-extended, app-10y) must pass "full" - they are databases
      for their feed scope, not store shards, and the refresh-full validation
      rejects completeness=partial images.
    required: false
    default: "auto"
  shard-types:
    description: Comma-separated purl types this shard serves (e.g. "pypi,npm"). Empty for full.
    required: false
    default: ""
  version-tag:
    description: Version tag for published artifacts (e.g. v7.0.x)
    required: false
    default: v7.0.x
  hf-repo:
    description: Hugging Face dataset repository
    required: false
    default: AppThreat/vdb
  hf-path-prefix:
    description: Hugging Face destination prefix for uploaded files
    required: true
  nvd-start-year:
    description: Value for NVD_START_YEAR environment variable
    required: true
  github-page-count:
    description: Value for GITHUB_PAGE_COUNT environment variable
    required: true
  python-executable:
    description: Python executable used to build VDB
    required: false
    default: python
  cleanup-os-directories:
    description: Remove OS-specific directories from vuln-list before packaging
    required: false
    default: "true"
  clean-workspace:
    description: Remove build output directories before creating them
    required: false
    default: "false"
  app-only-mode:
    description: Enable application-only environment flags
    required: false
    default: "false"
  include-metadata:
    description: Populate extended cve_metadata tables for metadata search APIs
    required: false
    default: "false"
  cache-extra-args:
    description: Additional newline-delimited arguments passed to the vdb cache command, one argument per line
    required: false
    default: ""
  upload-to-hf:
    description: Upload built artifacts directly to Hugging Face
    required: false
    default: "true"
  zstd-level:
    description: zstd compression level (the v6 action used --ultra with no level, defaulting to 3)
    required: false
    default: "19"
  build-id:
    description: Unique build identifier shared across all artifacts from this build
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CACHE_EXTRA_ARGS: ${{ inputs.cache-extra-args }}
        ZSTD_LEVEL: ${{ inputs.zstd-level }}
        BUILD_ID: ${{ inputs.build-id }}
        SHARD_NAME: ${{ inputs.shard-name }}
        SHARD_TYPES: ${{ inputs.shard-types }}
        ARTIFACT_KIND: ${{ inputs.artifact-kind }}
        VERSION_TAG: ${{ inputs.version-tag }}
      run: |
        set -euo pipefail

        # Shared manifest helper, resolved to an absolute path NOW: this
        # step cds into vdb_data later, and the sibling-index loop would
        # otherwise need a relative path that changes under it. See the
        # script's docstring for why none of this is inline python -c.
        META_TOOL="$(cd "$GITHUB_ACTION_PATH/../../scripts" && pwd)/vdb7_meta.py"

        export VDB_HOME=vdb_data
        export VDB_CACHE=vdb_cache
        export NVD_START_YEAR="${{ inputs.nvd-start-year }}"
        export GITHUB_PAGE_COUNT="${{ inputs.github-page-count }}"

        if [[ "${{ inputs.app-only-mode }}" == "true" ]]; then
          export VDB_IGNORE_OS=true
          export VDB_IGNORE_ALMALINUX=true
          export VDB_IGNORE_ALPINE=true
          export VDB_IGNORE_DEBIAN=true
          export VDB_IGNORE_ROCKYLINUX=true
        else
          # The SUSE and openSUSE OSV feeds are opt-in in the library, so an
          # OS build has to ask for them explicitly or it silently publishes
          # no SUSE data at all (~487k rows, and the only source for them
          # now that the cvrf vuln-list tree is dropped above). Verified to
          # ingest in ~165s for openSUSE after the start-year filter fix that
          # made these feeds opt-in in the first place.
          export VDB_INCLUDE_SUSE=true
          export VDB_INCLUDE_OPENSUSE=true
        fi

        if [[ "${{ inputs.clean-workspace }}" == "true" ]]; then
          rm -rf vdb_data vdb_cache
        fi

        mkdir -p vdb_data vdb_cache

        if [[ "${{ inputs.cleanup-os-directories }}" == "true" ]]; then
          # ubuntu, debian, redhat and the whole cvrf/suse tree (SUSE +
          # openSUSE) are ingested from the OSV feeds instead
          # (vulnerability-db tasks 10.6/10.8/10.10/10.11) and their
          # vuln-list subtrees are ignored at ingest, so zipping them only
          # pays to compress and re-read data the build discards:
          # 3,313 + 480 + 196 + 2,217 MB uncompressed, 279k of the tree's
          # 873k files. cvrf holds nothing but suse/ and opensuse/, so the
          # whole directory goes. Keep them for the v5/v6 actions, which
          # still read them.
          rm -rf "./${{ inputs.vuln-list-path }}/kevc" \
                 "./${{ inputs.vuln-list-path }}/mariner" \
                 "./${{ inputs.vuln-list-path }}/cvrf" \
                 "./${{ inputs.vuln-list-path }}/ubuntu" \
                 "./${{ inputs.vuln-list-path }}/debian" \
                 "./${{ inputs.vuln-list-path }}/redhat"
        fi

        zip -q -r vuln-list.zip "./${{ inputs.vuln-list-path }}/"
        mv vuln-list.zip vdb_cache/
        rm -rf "./${{ inputs.vuln-list-path }}/"

        CACHE_ARGS=(--cache-os)
        if [[ -n "$CACHE_EXTRA_ARGS" ]]; then
          while IFS= read -r extra_cache_arg; do
            if [[ -n "$extra_cache_arg" ]]; then
              CACHE_ARGS+=("$extra_cache_arg")
            fi
          done <<< "$CACHE_EXTRA_ARGS"
        fi
        if [[ "${{ inputs.include-metadata }}" == "true" ]]; then
          CACHE_ARGS+=(--include-metadata)
        fi
        # Shard production belongs to the gated split-and-upload-vdb7 action
        # (match-set gate, per-shard publish, sibling index). The build's own
        # default post-build split is therefore disabled here — letting it
        # run would double the split cost and produce ungated shards.
        CACHE_ARGS+=(--no-split)
        ${{ inputs.python-executable }} vulnerability-db/vdb/cli.py "${CACHE_ARGS[@]}"

        ls -lh vdb_data
        ls -lh vdb_cache

        cd vdb_data

        # ── Manifest v2 ──────────────────────────────────────────────
        # Upgrade vdb.meta in place; see vdb7_meta.py's `init` docstring for
        # what the fields mean and why artifact-kind is load-bearing.
        "${{ inputs.python-executable }}" "$META_TOOL" init vdb.meta \
          --build-id "$BUILD_ID" \
          --shard-name "$SHARD_NAME" \
          --kind "${ARTIFACT_KIND:-auto}" \
          --types "$SHARD_TYPES" \
          --version-tag "$VERSION_TAG"

        # ── Compression ──────────────────────────────────────────────
        XZ_THREADS="$(nproc 2>/dev/null || echo 2)"
        if (( XZ_THREADS > 4 )); then
          XZ_THREADS=4
        fi
        echo "Creating .tar.xz artifacts with xz preset -7 and ${XZ_THREADS} thread(s)"
        tar -cf - data.vdb7 | xz -7 -T"$XZ_THREADS" -c > data.vdb7.tar.xz
        tar -cf - data.index.vdb7 | xz -7 -T"$XZ_THREADS" -c > data.index.vdb7.tar.xz

        echo "Creating .tar.zst artifacts with zstd level ${ZSTD_LEVEL} --ultra, $(nproc) thread(s)"
        zstd -"${ZSTD_LEVEL}" --ultra -T0 data.index.vdb7 -f
        zstd -"${ZSTD_LEVEL}" --ultra -T0 data.vdb7 -f

        echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_USERNAME" --password-stdin

        XZ_REPO="ghcr.io/appthreat/vdb7-${SHARD_NAME}"
        ZST_REPO="ghcr.io/appthreat/vdb7-${SHARD_NAME}"

        # ── Push xz artifact ─────────────────────────────────────────
        # Patch meta for xz. siblings.available stays empty until the
        # finalization step after every push (stamp with no --siblings).
        "${{ inputs.python-executable }}" "$META_TOOL" stamp vdb.meta --compression xz

        oras push "${XZ_REPO}:${VERSION_TAG}-xz" \
          --artifact-type application/vnd.oras.config.v1+json \
          ./vdb.meta:application/vnd.appthreat.vdb.config.v1+json \
          ./data.vdb7.tar.xz:application/vnd.appthreat.vdb.layer.v1+tar \
          ./data.index.vdb7.tar.xz:application/vnd.appthreat.vdb.layer.v1+tar

        oras tag "${XZ_REPO}:${VERSION_TAG}-xz" "v7-xz" "latest-xz"

        if [[ "${{ inputs.upload-to-hf }}" == "true" ]]; then
          hf upload --quiet --repo-type dataset --delete "${{ inputs.hf-path-prefix }}/*.tar.xz" "${{ inputs.hf-repo }}" ./data.vdb7.tar.xz "${{ inputs.hf-path-prefix }}/data.vdb7.tar.xz"
          hf upload --quiet --repo-type dataset "${{ inputs.hf-repo }}" ./data.index.vdb7.tar.xz "${{ inputs.hf-path-prefix }}/data.index.vdb7.tar.xz"
        fi

        # ── Push zst artifact ────────────────────────────────────────
        # Patch meta for zst
        "${{ inputs.python-executable }}" "$META_TOOL" stamp vdb.meta --compression zst

        oras push "${ZST_REPO}:${VERSION_TAG}-zst" \
          --artifact-type application/vnd.oras.config.v1+json \
          ./vdb.meta:application/vnd.appthreat.vdb.config.v1+json \
          ./data.vdb7.zst:application/vnd.appthreat.vdb.layer.v1+zst \
          ./data.index.vdb7.zst:application/vnd.appthreat.vdb.layer.v1+zst

        oras tag "${ZST_REPO}:${VERSION_TAG}-zst" "v7-zst" "latest-zst"

        if [[ "${{ inputs.upload-to-hf }}" == "true" ]]; then
          hf upload --quiet --repo-type dataset --delete "${{ inputs.hf-path-prefix }}/*.zst" "${{ inputs.hf-repo }}" ./data.vdb7.zst "${{ inputs.hf-path-prefix }}/data.vdb7.zst"
          hf upload --quiet --repo-type dataset "${{ inputs.hf-repo }}" ./data.index.vdb7.zst "${{ inputs.hf-path-prefix }}/data.index.vdb7.zst"
          hf upload --quiet --repo-type dataset --delete "${{ inputs.hf-path-prefix }}/*.vdb7" "${{ inputs.hf-repo }}" ./data.vdb7 "${{ inputs.hf-path-prefix }}/data.vdb7"
          hf upload --quiet --repo-type dataset "${{ inputs.hf-repo }}" ./data.index.vdb7 "${{ inputs.hf-path-prefix }}/data.index.vdb7"
          hf upload --quiet --repo-type dataset "${{ inputs.hf-repo }}" ./vdb.meta "${{ inputs.hf-path-prefix }}/vdb.meta"
        fi

        # ── Sibling index finalization (LAST, after every push) ──────
        # Both encodings of this artifact pushed successfully above (a
        # failure aborts the step before reaching here), so advertising
        # itself is now truthful. Shards extend this list afterwards in
        # split-and-upload-vdb7, re-publishing manifests again as their
        # final step. Layer blobs are content-addressed and already in the
        # registry, so these re-pushes upload only the config + manifest.
        #
        # The list is SHARD_NAME, not a hard-coded 'full'. For the full
        # build the two are the same string, but for any other artifact the
        # literal was a lie: vdb7-app-10y-extended shipped a manifest
        # claiming its sibling set is ['full'], pointing a consumer who
        # installed it as their main database at an unrelated build.
        for ENC in xz zst; do
          LAYER_EXT="tar.xz"
          MEDIA_SUFFIX="tar"
          if [[ "$ENC" = "zst" ]]; then
            LAYER_EXT="zst"
            MEDIA_SUFFIX="zst"
          fi
          "${{ inputs.python-executable }}" "$META_TOOL" stamp vdb.meta \
            --compression "$ENC" --siblings "$SHARD_NAME"
          oras push "ghcr.io/appthreat/vdb7-${SHARD_NAME}:${VERSION_TAG}-${ENC}" \
            --artifact-type application/vnd.oras.config.v1+json \
            ./vdb.meta:application/vnd.appthreat.vdb.config.v1+json \
            "./data.vdb7.${LAYER_EXT}:application/vnd.appthreat.vdb.layer.v1+${MEDIA_SUFFIX}" \
            "./data.index.vdb7.${LAYER_EXT}:application/vnd.appthreat.vdb.layer.v1+${MEDIA_SUFFIX}"
          # Re-point the floating tags at the finalized manifest: the push
          # above minted a new digest, and v7-*/latest-* still resolve to
          # the earlier manifest carrying siblings.available = [].
          oras tag "ghcr.io/appthreat/vdb7-${SHARD_NAME}:${VERSION_TAG}-${ENC}" "v7-${ENC}" "latest-${ENC}"
        done

        # Restore the on-disk meta to the canonical uncompressed form. The
        # full build's copy is what split-and-upload-vdb7 reads next, so it
        # must match what was published, SHARD_NAME included.
        "${{ inputs.python-executable }}" "$META_TOOL" stamp vdb.meta \
          --compression none --siblings "$SHARD_NAME"
